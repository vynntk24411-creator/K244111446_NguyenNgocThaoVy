<html>
    <head>
        <meta charset="utf-8">
        <title>Contact - GET</title>
        <style>
            .form-group{
                margin-bottom:15px;
            }
            input{
                width:100%
            }
        </style>
    </head>
    <body>
        <div style="width: 400px; height: 500px; border: 1px solid black; background-color: #ffffff; margin: auto; padding: 5px;">
            <form onsubmit="save(event)">
                <h3>Contact the editorial office</h3>
                <div class="form-group">
                    <label for="full_name">Full name</label><br>
                    <input type="text" name="fullname" id="full_name">
                </div>
                <div class="form-group">
                    <table style="width:100%">
                        <tr>
                            <td>
                                <label for="email">Email</label><br>
                                <input type="text" name="email" id="email">
                            </td>
                            <td>
                                <label for="sendto">Send to</label><br>
                                <select name="sendto" style="width:100%">
                                    <option value="editorial_board">Editorial board</option>
                                    <option value="news_department">News Department</option>
                                    <option value="board_of_perspectives">Board of Perspectives</option>
                                    <option value="world_board">World Board</option>
                                    <option value="business_department">Business Department</option>
                                </select>
                            </td>
                        </tr>
                    </table>
                </div>
                <div class="form-group">
                    <label for="title">Title</label><br>
                    <input type="text" name="title" id="title">
                </div>
                <div class="form-group">
                    <label for="content">Content</label><br>
                    <textarea name="content" id="content" style="width:100%; height:200px;"></textarea>
                </div>
                <div>
                    <input type="button" value="Send" style="background-color:rgb(252, 2, 106); color:white; width: 80px">
                </div>
            </form>
        </div>
    </body>
</html>
