<html>
    <head>
        <meta charset="utf-8">
        <title>Travel Expense Report</title>
        <style>
            .form-group{
                margin-bottom:15px;
            }
            table{
                border-collapse:collapse
            }
            td, th{
                padding:3px
            }
</style>
    </head>
    <body>
        <div style="width: 600px; height: 650px; border: 1px solid black; background-color: #aff6ff; margin: auto; padding: 20px;">
            <div style="text-align: center;">
                <img src="DeLong.jpg" alt="DeLong" style="width:60%">
            </div>
            <h2>Travel Expense Report</h2>
            <hr>
            <form id="expenseForm" onsubmit="return handleSubmit()">
                <div class="form-group">
                    <label for="first_name">1) First Name:</label>
                    <input type="text" name="firstName" id="first_name">
                    <label for="last_name" style="width:80px">Last Name:</label>
                    <input type="text" name="lastName" id="last_name">
                </div>
                <div class="form-group">
                    <label for="ss_number">2) Social Security Number:</label>
                    <input type="text" name="ssNumber" id="ss_number">
                </div>
                <div class="form-group">
                    <label for="department">3) Department:</label>
                    <select id="department" name="department">
                        <option value="accounting">Accounting</option>
                        <option value="marketing">Marketing</option>
                        <option value="engineering">Engineering</option>
                        <option value="hr">Human Resources</option>
                        <option value="finance">Finance</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="expense_type">4) Describe the purpose of your trip:</label><br>
                    <input type="text" id="expense_type" name="expenseType" style="width:450px; height:80px">
                </div>
                <div class="form-group">
                    <label for="expenses">5) Itemize your travel expenses:</label><br>
                    <table border="1">
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Amount</th>
                        </tr>
                        <tr>
                            <td><input type="date" name="expenseDate1"></td>
                            <td><input type="text" name="expenseDesc1"></td>
                            <td>
                                <select name="expenseCategory1">
                                    <option value="meals">Meals</option>
                                    <option value="lodging">Lodging</option>
                                    <option value="transportation">Transportation</option>
                                    <option value="entertainment">Entertainment</option>
                                    <option value="other">Other</option>
                                </select>
                            </td>   
                            <td><input type="number" name="expenseAmount2" step="0.01" style="width:50px"></td>
                        </tr>
                        <tr>
                            <td><input type="date" name="expenseDate2"></td>
                            <td><input type="text" name="expenseDesc2"></td>
                            <td>
                                <select name="expenseCategory2">
                                    <option value="meals">Meals</option>
                                    <option value="lodging">Lodging</option>
                                    <option value="transportation">Transportation</option>
                                    <option value="entertainment">Entertainment</option>
                                    <option value="other">Other</option>
                                </select>
                            </td>
                            <td><input type="number" name="expenseAmount2" step="0.01" style="width:50px"></td>
                        </tr>
                        <tr>
                            <td><input type="date" name="expenseDate3"></td>
                            <td><input type="text" name="expenseDesc3"></td>
                            <td>
                                <select name="expenseCategory3">
                                    <option value="meals">Meals</option>
                                    <option value="lodging">Lodging</option>
                                    <option value="transportation">Transportation</option>
                                    <option value="entertainment">Entertainment</option>
                                    <option value="other">Other</option>
                                </select>
                            </td>
                            <td><input type="number" name="expenseAmount2" step="0.01" style="width:50px"></td>
                        </tr>
                        <tr>
                            <td><input type="date" name="expenseDate4"></td>
                            <td><input type="text" name="expenseDesc4"></td>
                            <td>
                                <select name="expenseCategory4">
                                    <option value="meals">Meals</option>
                                    <option value="lodging">Lodging</option>
                                    <option value="transportation">Transportation</option>
                                    <option value="entertainment">Entertainment</option>
                                    <option value="other">Other</option>
                                </select>
                            </td>
                            <td><input type="number" name="expenseAmount4" step="0.01" style="width:50px"></td>
                        </tr>
                    </table>
                </div>
                <div class="form-group">
                    <label for="submittedReceipt">6) Have you submitted your receipt?</label>
                    <input type="radio" name="submittedReceipt" value="yes" id="submittedReceiptYes">
                    <label for="submittedReceiptYes">Yes</label>
                    <input type="radio" name="submittedReceipt" value="no" id="submittedReceiptNo">
                    <label for="submittedReceiptNo">No</label>
                </div>
                <div class="form-group">
                    <input type="submit" value="Submit travel expenses">
                    <input type="button" value="Reset" onclick="document.getElementById('expenseForm').reset()">
                </div>
                <p>Questions? Contact Debbie Larson in Accounting (ext.2150)</p>
            </form> 
        </div>
        <script>
            function handleSubmit(){
                alert('Biểu mẫu đã được gửi.');
                return false; // prevent actual submission since no action is set
            }
        </script>
    </body>
</html>
